# Nome padrão do projeto no Docker Compose.
# Pode ser sobrescrito por COMPOSE_PROJECT_NAME no arquivo .env.
name: "${COMPOSE_PROJECT_NAME:-php-docker-starter}"

services:
  # ====================================================================
  # PHP-FPM
  # ====================================================================
  php:
    # Constrói a imagem PHP personalizada do projeto.
    build:
      # Define a raiz do projeto como contexto de construção.
      context: .

      # Dockerfile utilizado para construir o serviço PHP.
      dockerfile: docker/php/Dockerfile

      # Alinha o usuário www-data do contêiner com o usuário
      # do Linux host, evitando arquivos pertencentes ao root.
      args:
        HOST_UID: "${HOST_UID:-1000}"
        HOST_GID: "${HOST_GID:-1000}"

    # Diretório padrão dos comandos executados no contêiner.
    working_dir: /var/www/html

    # Envia explicitamente somente as variáveis necessárias
    # para a aplicação PHP.
    environment:
      # Ambiente da aplicação.
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"

      # Conexão interna com o MySQL.
      #
      # DB_HOST deve ser o nome do serviço Docker "mysql".
      # Não utilize localhost dentro do contêiner PHP.
      DB_HOST: "${DB_HOST:-mysql}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-programming_with_gio}"
      DB_USERNAME: "${DB_USERNAME:-app}"
      DB_PASSWORD: "${DB_PASSWORD:-local_password}"

    # Monta todo o projeto em /var/www/html.
    #
    # Alterações realizadas no host ficam imediatamente
    # disponíveis dentro do contêiner.
    volumes:
      - ./:/var/www/html

    # O serviço PHP somente será iniciado depois que o
    # healthcheck do MySQL informar que o banco está saudável.
    depends_on:
      mysql:
        condition: service_healthy

    # Reinicia após falhas ou reinicialização do Docker,
    # exceto quando o serviço for interrompido manualmente.
    restart: unless-stopped

    # O PHP fica somente na rede privada do projeto.
    #
    # A porta 9000 não é publicada no computador.
    networks:
      - app-network

  # ====================================================================
  # NGINX
  # ====================================================================
  nginx:
    # Imagem oficial com linha explicitamente definida.
    image: nginx:1.28-alpine

    # Inicia o contêiner PHP antes do Nginx.
    #
    # O PHP, por sua vez, aguarda o MySQL ficar saudável.
    depends_on:
      - php

    # Publica a porta do Nginx no computador.
    #
    # Exemplo com APP_PORT=8081:
    # http://localhost:8081
    ports:
      - "${APP_PORT:-8080}:80"

    volumes:
      # O Nginx precisa apenas ler os arquivos da aplicação.
      - ./:/var/www/html:ro

      # Substitui a configuração padrão do Nginx.
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    restart: unless-stopped

    # Permite a comunicação com php:9000.
    networks:
      - app-network

  # ====================================================================
  # MYSQL
  # ====================================================================
  mysql:
    # Linha LTS do MySQL.
    image: mysql:8.4

    # Publica o MySQL somente na interface local do computador.
    #
    # 127.0.0.1:
    #   Impede conexões vindas de outros dispositivos da rede.
    #
    # 3307:
    #   Porta usada pelo MySQL Workbench no Linux Mint.
    #
    # 3306:
    #   Porta interna do MySQL no contêiner.
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"

    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-programming_with_gio}"
      MYSQL_USER: "${DB_USERNAME:-app}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-local_password}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-local_root_password}"

    volumes:
      - mysql-data:/var/lib/mysql

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysqladmin ping
          --host=localhost
          --user=root
          --password="$${MYSQL_ROOT_PASSWORD}"
          --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

    restart: unless-stopped

    networks:
      - app-network

# ======================================================================
# REDES
# ======================================================================
networks:
  # Rede privada compartilhada por Nginx, PHP-FPM e MySQL.
  app-network:
    driver: bridge

# ======================================================================
# VOLUMES
# ======================================================================
volumes:
  # Volume persistente do MySQL.
  mysql-data:
