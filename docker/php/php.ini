; ======================================================================
; PHP Docker Starter
; Configuração do PHP para desenvolvimento local
; ======================================================================
;
; Este arquivo é carregado pelo Dockerfile em:
; /usr/local/etc/php/conf.d/99-app.ini
;
; O prefixo 99 faz com que estas configurações sejam carregadas
; depois das configurações padrão da imagem oficial do PHP.
;
; Esta configuração NÃO deve ser usada diretamente em produção.
; ======================================================================


; ======================================================================
; INFORMAÇÕES GERAIS
; ======================================================================

[PHP]

; Oculta a versão do PHP nos cabeçalhos HTTP.
; Evita divulgar desnecessariamente detalhes tecnológicos da aplicação.
expose_php = Off

; Define UTF-8 como codificação padrão.
default_charset = "UTF-8"

; Define o fuso horário padrão da aplicação.
; Desde o PHP 8.2, valores vazios ou inválidos geram aviso.
date.timezone = "America/Sao_Paulo"

; Variáveis disponibilizadas pelo PHP.
;
; G = GET
; P = POST
; C = COOKIE
; S = SERVER
;
; A variável de ambiente E foi omitida para evitar importar
; automaticamente todas as variáveis do processo para $_ENV.
variables_order = "GPCS"

; Impede carregamento dinâmico de extensões durante a execução.
; As extensões devem ser definidas na construção da imagem.
enable_dl = Off


; ======================================================================
; ERROS E DIAGNÓSTICO
; ======================================================================

; Exibe todos os erros, avisos e depreciações.
; Útil para detectar problemas durante o desenvolvimento.
error_reporting = E_ALL

; Exibe erros diretamente na resposta.
;
; IMPORTANTE:
; Esta opção é adequada apenas para desenvolvimento local.
; Em produção deve ser definida como Off.
display_errors = On

; Exibe erros ocorridos durante a inicialização do PHP.
;
; IMPORTANTE:
; Em produção deve ser definida como Off.
display_startup_errors = On

; Registra erros no log.
; Esta opção deverá permanecer habilitada também em produção.
log_errors = On

; Envia os erros para o fluxo de erro padrão do contêiner.
; Dessa forma, os registros ficam disponíveis em:
; docker compose logs php
error_log = /proc/self/fd/2

; Evita repetição ilimitada de mensagens idênticas.
ignore_repeated_errors = On

; Limita o tamanho de cada mensagem registrada no log.
log_errors_max_len = 4096

; Não insere marcação HTML nas mensagens de erro.
html_errors = Off


; ======================================================================
; RECURSOS E LIMITES DE EXECUÇÃO
; ======================================================================

; Memória máxima permitida para cada processo PHP.
memory_limit = 256M

; Tempo máximo de execução de um script web, em segundos.
max_execution_time = 30

; Tempo máximo para processar dados recebidos, em segundos.
max_input_time = 60

; Quantidade máxima de parâmetros de entrada.
; Ajuda a limitar requisições excessivamente grandes.
max_input_vars = 1000

; Tempo padrão para operações de rede, em segundos.
default_socket_timeout = 60


; ======================================================================
; UPLOADS E CONTEÚDO DE REQUISIÇÕES
; ======================================================================

; Permite uploads de arquivos.
file_uploads = On

; Tamanho máximo de cada arquivo enviado.
upload_max_filesize = 16M

; Tamanho máximo de toda a requisição POST.
;
; Este valor deve ser igual ou maior que upload_max_filesize.
post_max_size = 20M

; Quantidade máxima de arquivos em uma mesma requisição.
max_file_uploads = 20


; ======================================================================
; ACESSO A ARQUIVOS E URLs
; ======================================================================

; Permite que funções de leitura, como file_get_contents,
; acessem URLs externas.
;
; Algumas bibliotecas dependem desse recurso. O código da aplicação
; nunca deve utilizar URLs fornecidas pelo usuário sem validação.
allow_url_fopen = On

; Impede que arquivos PHP remotos sejam usados em include ou require.
; Esta opção deve permanecer desabilitada.
allow_url_include = Off


; ======================================================================
; SEGURANÇA DO PHP-FPM E FASTCGI
; ======================================================================

; Evita que caminhos inexistentes sejam interpretados como arquivos PHP.
;
; Esta proteção será complementada pelo try_files na configuração
; do Nginx.
cgi.fix_pathinfo = 0


; ======================================================================
; SESSÕES
; ======================================================================

[Session]

; Não inicia sessões automaticamente.
; A aplicação deve chamar session_start() explicitamente.
session.auto_start = 0

; Utiliza cookies para transportar o identificador da sessão.
session.use_cookies = 1

; Aceita o identificador da sessão somente por cookie.
; Evita identificadores de sessão em URLs ou formulários.
session.use_only_cookies = 1

; Rejeita identificadores de sessão que não tenham sido criados
; pelo próprio PHP.
;
; Essa configuração ajuda a mitigar fixação de sessão.
session.use_strict_mode = 1

; Impede acesso ao cookie de sessão pelo JavaScript.
; Ajuda a reduzir o risco de roubo do cookie por scripts injetados.
session.cookie_httponly = 1

; Define o cookie como válido apenas durante a sessão do navegador.
; Ao fechar o navegador, o cookie de sessão deve ser descartado.
session.cookie_lifetime = 0

; Deixa o cookie disponível para toda a aplicação.
session.cookie_path = "/"

; Reduz o envio do cookie em requisições originadas em outros sites.
; Lax oferece compatibilidade adequada para desenvolvimento e
; para a maioria das aplicações web.
session.cookie_samesite = "Lax"

; Em desenvolvimento local utilizaremos HTTP.
; Por isso, o atributo Secure precisa permanecer desabilitado.
;
; IMPORTANTE:
; Em produção com HTTPS, deve ser alterado para 1.
session.cookie_secure = 0

; Impede a inclusão automática do identificador de sessão nas URLs.
session.use_trans_sid = 0

; Tempo de vida dos dados da sessão no servidor, em segundos.
; 1440 segundos correspondem a 24 minutos.
session.gc_maxlifetime = 1440

; Mantém o armazenamento padrão da sessão em arquivos.
session.save_handler = files


; ======================================================================
; OPCACHE
; ======================================================================

[opcache]

; No PHP 8.5, o OPcache já faz parte do PHP e não deve ser instalado
; com docker-php-ext-install.
;
; Esta seção apenas configura o recurso já presente na imagem.

; Habilita o OPcache para requisições processadas pelo PHP-FPM.
opcache.enable = 1

; Habilita o OPcache também para comandos executados no terminal.
; Isso pode beneficiar Composer e outras ferramentas PHP.
opcache.enable_cli = 1

; Verifica se os arquivos PHP foram modificados.
; Deve permanecer habilitado no desenvolvimento.
opcache.validate_timestamps = 1

; Verifica alterações imediatamente a cada requisição.
; Útil para que mudanças no código apareçam sem reiniciar o contêiner.
opcache.revalidate_freq = 0

; Quantidade de memória reservada ao OPcache.
opcache.memory_consumption = 128

; Memória reservada para strings internadas.
opcache.interned_strings_buffer = 16

; Número máximo aproximado de arquivos armazenados pelo OPcache.
opcache.max_accelerated_files = 10000

; Mantém comentários e atributos necessários para reflexão,
; frameworks, bibliotecas e ferramentas.
opcache.save_comments = 1

; Impede que o OPcache continue servindo código antigo quando
; uma atualização falhar.
opcache.consistency_checks = 0

; JIT não é necessário nesta estação web genérica.
; Evita consumo adicional de memória sem benefício comprovado.
opcache.jit = disable
opcache.jit_buffer_size = 0