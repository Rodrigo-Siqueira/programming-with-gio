# ======================================================================
# PHP Docker Starter
# Configuração do Nginx para desenvolvimento local
# ======================================================================
#
# Este arquivo é montado pelo Docker Compose em:
# /etc/nginx/conf.d/default.conf
#
# O Nginx recebe as requisições HTTP e:
#
# 1. entrega arquivos estáticos diretamente;
# 2. encaminha arquivos PHP ao serviço PHP-FPM;
# 3. direciona rotas inexistentes para o front controller index.php.
#
# Esta configuração é destinada ao desenvolvimento local.
# HTTPS deverá ser configurado separadamente em produção.
# ======================================================================


server {
    # ------------------------------------------------------------------
    # Porta interna do servidor
    # ------------------------------------------------------------------
    # O Nginx escuta na porta 80 dentro do contêiner.
    #
    # O Docker Compose publica essa porta no computador utilizando
    # APP_PORT, que inicialmente terá o valor 8080.
    listen 80;

    # Também permite conexões IPv6 dentro do contêiner.
    listen [::]:80;


    # ------------------------------------------------------------------
    # Nome do servidor
    # ------------------------------------------------------------------
    # O caractere "_" funciona como nome genérico para este servidor.
    #
    # Isso permite acessar o ambiente por localhost sem depender
    # de um domínio configurado.
    server_name _;


    # ------------------------------------------------------------------
    # Diretório público
    # ------------------------------------------------------------------
    # Somente este diretório poderá ser servido pelo Nginx.
    #
    # Arquivos como composer.json, compose.yaml, .env e docker/
    # permanecem fora da raiz pública.
    root /var/www/html/src/public;

    # Ordem de arquivos procurados ao acessar um diretório.
    index index.php index.html;


    # ------------------------------------------------------------------
    # Configurações gerais
    # ------------------------------------------------------------------
    # Define UTF-8 como codificação padrão das respostas textuais.
    charset utf-8;

    # Remove a versão do Nginx da página de erro e do cabeçalho Server.
    #
    # A presença do cabeçalho "Server: nginx" ainda poderá ocorrer,
    # mas sem divulgar a versão específica.
    server_tokens off;

    # Limita o tamanho do corpo da requisição.
    #
    # O valor precisa ser compatível com post_max_size do php.ini,
    # que foi configurado como 20M.
    client_max_body_size 20M;


    # ------------------------------------------------------------------
    # Cabeçalhos básicos de segurança
    # ------------------------------------------------------------------
    # Impede que navegadores tentem interpretar um arquivo como um
    # tipo diferente daquele declarado pelo servidor.
    add_header X-Content-Type-Options "nosniff" always;

    # Impede que a aplicação seja exibida dentro de frames de
    # outros sites.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Limita as informações de origem enviadas ao navegar para
    # outros endereços.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;


    # ------------------------------------------------------------------
    # Rota principal
    # ------------------------------------------------------------------
    # Ordem de resolução:
    #
    # 1. tenta localizar um arquivo correspondente;
    # 2. tenta localizar um diretório correspondente;
    # 3. envia a requisição para index.php;
    # 4. preserva os parâmetros da URL.
    #
    # O terceiro comportamento prepara a estação para aplicações
    # que utilizam front controller e roteamento centralizado.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }


    # ------------------------------------------------------------------
    # Processamento de arquivos PHP
    # ------------------------------------------------------------------
    # Esta expressão corresponde a endereços terminados em ".php".
    #
    # O símbolo "~" informa ao Nginx que a regra usa expressão regular.
    # O "\." representa um ponto literal.
    # O "$" representa o final do endereço.
    location ~ \.php$ {
        # Confirma que o arquivo PHP existe antes de encaminhá-lo.
        #
        # Isso evita enviar ao PHP-FPM caminhos PHP inexistentes.
        try_files $uri =404;

        # Carrega os parâmetros FastCGI padrão fornecidos pela
        # imagem oficial do Nginx.
        include fastcgi_params;

        # Encaminha a requisição ao serviço "php" do Docker Compose.
        #
        # php:
        #   Nome do serviço definido no compose.yaml.
        #
        # 9000:
        #   Porta interna usada pelo PHP-FPM.
        fastcgi_pass php:9000;

        # Define o arquivo inicial para processamento FastCGI.
        fastcgi_index index.php;

        # Informa ao PHP-FPM o caminho absoluto do script.
        #
         # Exemplo:
        # /var/www/html/src/public/index.php
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Informa ao PHP-FPM qual é a raiz pública da aplicação.
        fastcgi_param DOCUMENT_ROOT $document_root;

        # Limites de comunicação com o PHP-FPM.
        #
        # Esses valores evitam conexões indefinidamente bloqueadas.
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 30s;
        fastcgi_read_timeout 30s;
    }


    # ------------------------------------------------------------------
    # Bloqueio de arquivos ocultos
    # ------------------------------------------------------------------
    # Bloqueia arquivos e diretórios cujo nome começa com ponto.
    #
    # Exemplos:
    # .env
    # .git
    # .htaccess
    #
    # A exceção ".well-known" poderá ser usada futuramente para
    # validação de domínio e certificados.
    location ~ /\.(?!well-known/) {
        deny all;
    }


    # ------------------------------------------------------------------
    # Bloqueio de arquivos sensíveis
    # ------------------------------------------------------------------
    # Esta regra funciona como proteção adicional caso um arquivo
    # sensível seja colocado acidentalmente em src/public.
    #
    # O símbolo "~*" indica uma expressão regular sem diferenciação
    # entre letras maiúsculas e minúsculas.
    location ~* \.(ini|log|sh|sql|env|yaml|yml|conf)$ {
        deny all;
    }


    # ------------------------------------------------------------------
    # Arquivos estáticos
    # ------------------------------------------------------------------
    # Define cache curto para recursos estáticos.
    #
    # Como esta estação é voltada ao desenvolvimento, utilizamos
    # apenas uma hora para evitar cache prolongado no navegador.
    location ~* \.(css|js|jpg|jpeg|png|gif|svg|ico|webp|woff|woff2)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        access_log off;

        # Retorna 404 se o arquivo estático não existir.
        # Esses arquivos não serão enviados ao index.php.
        try_files $uri =404;
    }


    # ------------------------------------------------------------------
    # Logs
    # ------------------------------------------------------------------
    # A imagem oficial direciona esses arquivos para os fluxos
    # padrão do contêiner.
    #
    # Os registros poderão ser consultados om:
    # docker compose logs nginx
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
}